[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helixvault"
version = "0.1.0"
authors = [
  { name = "Nitish Pattar", email = "nitishpattar7@gmail.com" },
]
description = "Python library for digital data encoding into DNA sequences"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "reedsolo>=1.7.0",
  "cryptography>=41.0.0",
]

[project.optional-dependencies]
compression = [
  "zstandard>=0.22.0",
  "brotli>=1.1.0",
]

[project.scripts]
helixvault = "helixvault.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["helixvault*"]
