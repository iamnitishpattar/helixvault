name: HelixVault CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-cov

      - name: Lint with flake8
        run: |
          pip install flake8
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --exclude=venv,.venv,__pycache__,.pytest_cache --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warn on style issues but don't fail the build
          flake8 . --exclude=venv,.venv,__pycache__,.pytest_cache --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Debug — check imports
        env:
          DATABASE_URL: "sqlite:///./test_ci.db"
          SMTP_EMAIL: "ci@helixvault.com"
          SMTP_PASSWORD: "dummy"
          ENTREZ_EMAIL: "ci@helixvault.com"
          NCBI_API_KEY: ""
          GROQ_API_KEY: ""
          PYTHONPATH: "."
        run: |
          python -c "import sys; print('Python:', sys.version)"
          python -c "from db.database import Base; print('DB OK')"
          python -c "from db.models import User, EncodedFile; print('Models OK')"
          python -c "from core.encoder import encode_to_dna, decode_from_dna; print('Encoder OK')"
          python -c "from core.ai_copilot import ask_copilot; print('AI Copilot OK')"
          python -c "from core.bio_compute import search_in_dna; print('Bio compute OK')"
          python -c "from core.steganography import embed_payload; print('Stego OK')"
          python -c "from core.plasmid_engine import get_available_vectors; print('Plasmid OK')"
          python -m pytest tests/ --collect-only -q

      - name: Run tests with coverage
        env:
          # Set dummy env vars so the app doesn't fail to start in CI
          SMTP_EMAIL: "ci@helixvault.com"
          SMTP_PASSWORD: "dummy"
          ENTREZ_EMAIL: "ci@helixvault.com"
          NCBI_API_KEY: ""
          GROQ_API_KEY: ""
          DATABASE_URL: "sqlite:///./test_ci.db"
          PYTHONPATH: "."
        run: |
          pytest tests/ -v --tb=long --cov=core --cov-report=term-missing

  frontend-lint:
    name: Frontend — Install & Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle (smoke test)
        run: npm run build
