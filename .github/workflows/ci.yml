name: HelixVault CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-cov

      - name: Lint with flake8
        run: |
          pip install flake8
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --exclude=venv,.venv,__pycache__,.pytest_cache --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warn on style issues but don't fail the build
          flake8 . --exclude=venv,.venv,__pycache__,.pytest_cache --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Run tests with coverage
        env:
          # Set dummy env vars so the app doesn't fail to start in CI
          SMTP_EMAIL: "ci@helixvault.com"
          SMTP_PASSWORD: "dummy"
          ENTREZ_EMAIL: "ci@helixvault.com"
          NCBI_API_KEY: ""
          DATABASE_URL: "sqlite:///./test_ci.db"
        run: |
          pytest tests/ -v --tb=short --cov=core --cov-report=term-missing

  frontend-lint:
    name: Frontend — Install & Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle (smoke test)
        run: npm run build
