<!DOCTYPE html>
<html>
<head><title>Test Video Playback</title></head>
<body style="background:#222; color:#fff; font-family:sans-serif; padding:20px;">
  <h2>Testing E:\video.mp4 direct playback</h2>
  <video id="v" controls style="width:600px;" src="video60_perfect.mp4"></video>
  <br><br>
  <audio id="a" controls src="video60_audio.mp3"></audio>
  <div id="log" style="margin-top:20px; font-family:monospace;"></div>
  <script>
    const v = document.getElementById('v');
    const a = document.getElementById('a');
    const log = document.getElementById('log');
    
    function appendLog(msg) {
      log.innerHTML += msg + '<br>';
      console.log(msg);
    }

    v.onloadedmetadata = () => {
      appendLog(`Video metadata loaded: duration=${v.duration}, videoWidth=${v.videoWidth}, videoHeight=${v.videoHeight}, volume=${v.volume}, muted=${v.muted}`);
      // Check audio tracks if supported
      if (v.audioTracks) {
        appendLog(`Audio tracks count: ${v.audioTracks.length}`);
      }
    };

    v.onerror = (e) => appendLog(`Video error: ${v.error ? v.error.message : e}`);
    a.onerror = (e) => appendLog(`Audio error: ${a.error ? a.error.message : e}`);
  </script>
</body>
</html>
